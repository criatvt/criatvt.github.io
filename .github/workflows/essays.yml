name: Refresh Substack essays

on:
  schedule:
    - cron: "0 1 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # to dispatch the Pages deploy after a refresh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-essays.mjs
      - name: Commit if changed
        id: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add public/essays.json
          if git diff --staged --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: refresh essays"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
      # A push made with GITHUB_TOKEN does not trigger `on: push` workflows,
      # so new essays would sit in the repo without ever being deployed.
      # Dispatch the deploy explicitly (workflow_dispatch is exempt from that
      # restriction) whenever the refresh actually committed something.
      - name: Deploy site with fresh essays
        if: github.ref == 'refs/heads/main' && steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
