name: Check links

# Checks every external link the site points to: pages, press articles,
# essays, Flickr photos and images. Runs on pushes to dev, on pull requests
# into main, weekly (links rot), and on demand. A broken link fails the run
# and the run summary lists it.
on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1" # Mondays
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          output: lychee.md
          format: markdown
          # Sites that refuse bots (LinkedIn 999, X, Amazon) still count as up
          # when they answer at all; anything 404/410/5xx fails. Only web
          # links are checked (site-internal paths are covered by the build),
          # and URLs that are templates in code (${...}) are skipped.
          args: >-
            --no-progress
            --max-concurrency 8
            --timeout 30
            --max-retries 3
            --user-agent "Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Safari/605.1.15"
            --accept "200..=299,403,429,999"
            --exclude "app\.kit\.com/forms"
            --exclude "api\.rss2json\.com"
            --exclude "corsproxy\.io"
            --exclude "allorigins\.win"
            --exclude "openrss\.org"
            --exclude "substack\.com/feed"
            --exclude "aasifj\.com/share\.png"
            --exclude "\$\{"
            --exclude "%7B"
            --scheme https
            --scheme http
            "src/**/*.tsx" "src/**/*.ts" "src/data/*.json" "public/essays.json"
            "public/resources/index.html" "public/nextread/index.html" "index.html"

      - name: Summary
        if: always()
        run: cat lychee.md >> "$GITHUB_STEP_SUMMARY"
