    <!-- Appearance follows the system unless the visitor chose one with the
         nav toggle (stored as "light" or "dark"). Applied before first paint
         so there is no flash; ThemeToggle keeps the same rule. -->
    <script>
      try {
        var t = localStorage.getItem('theme');
        var dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
    <!-- Single Page Apps for GitHub Pages: restore the deep link the 404.html redirect encoded. -->
    <!-- https://github.com/rafgraph/spa-github-pages -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
